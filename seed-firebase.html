<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Firebase – RA Moda Masculina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #f0c040; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 480px; }
    #btn { padding: 14px 36px; background: #f0c040; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    #btn:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 540px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 360px; overflow-y: auto; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>

<h1>🔥 Seed de Produtos – RA Moda Masculina</h1>
<p>Clique no botão abaixo para enviar todos os produtos, categorias e o cupom ao Firestore do Firebase. Execute <strong>apenas uma vez</strong>. Se rodar novamente, usará <code>set</code> com o mesmo ID (não duplica).</p>

<button id="btn">🚀 Enviar Produtos ao Firebase</button>

<div id="log"><span class="info">Aguardando…</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// TODO: preencher com as credenciais do Firebase deste projeto
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

const produtos = [
  { id: 1, nome: "Camiseta Polo Levi's",     categoria: "blusas",     preco: 59.00,  imagem: "./assets/masculina-blusa.jpeg",    descricao: "Camiseta Masculina Levi's Gola Polo Azul Marinho" },
  { id: 2, nome: "Camiseta Soldier Preta",   categoria: "blusas",     preco: 90.00,  imagem: "./assets/masculina-blusa2.jpeg",   descricao: "Camiseta Masculina Soldier Preta Bélica" },
  { id: 3, nome: "Calça Jeans",              categoria: "calças",     preco: 150.00, imagem: "./assets/calça-masculina1.jpeg",   descricao: "Calça Masculina Jeans Junior Confort Rasgada" },
  { id: 4, nome: "Shorts Masculino",         categoria: "shorts",     preco: 30.00,  imagem: "./assets/shots-masculino.jpeg",    descricao: "Shorts Masculino Confortável e Estiloso" },
  { id: 5, nome: "Relógio Dourado",          categoria: "acessórios", preco: 99.99,  imagem: "./assets/relogio-masculino.jpeg",  descricao: "Relógio Dourado Masculino Mondaine" },
  { id: 6, nome: "Sapato Casual",            categoria: "calçados",   preco: 99.99,  imagem: "./assets/sapato-masculino.jpeg",   descricao: "Sapato Masculino Casual Castelli Marinho" },
];

const categorias = [
  { id: "all",         nome: "Todos",       icone: "fa-border-all" },
  { id: "blusas",       nome: "Blusas",      icone: "fa-shirt" },
  { id: "calças",       nome: "Calças",      icone: "fa-user" },
  { id: "shorts",       nome: "Shorts",      icone: "fa-person-running" },
  { id: "acessórios",   nome: "Acessórios",  icone: "fa-watch-smart" },
  { id: "calçados",     nome: "Calçados",    icone: "fa-shoe-prints" },
];

const cupons = [
  { codigo: "DESCONTO10", tipo: "percentual", valor: 10, valorMinimo: 0, validade: null, ativo: true },
];

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const log = document.getElementById("log");
const btn = document.getElementById("btn");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";
  addLog("▶ Iniciando envio...", "info");

  let ok = 0, erros = 0;

  for (const p of produtos) {
    try {
      await db.collection("produtos").doc(String(p.id)).set({
        ...p,
        ativo: true,
        destaque: false,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      addLog(`✔ [${p.id}] ${p.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ [${p.id}] ${p.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Enviando categorias...", "info");
  for (const c of categorias) {
    try {
      await db.collection("categorias").doc(c.id).set(c);
      addLog(`✔ Categoria: ${c.nome}`, "ok");
    } catch (e) {
      addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Enviando cupons...", "info");
  for (const c of cupons) {
    try {
      await db.collection("cupons").doc(c.codigo).set(c);
      addLog(`✔ Cupom: ${c.codigo}`, "ok");
    } catch (e) {
      addLog(`✘ Cupom: ${c.codigo} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog(`━━━ CONCLUÍDO: ${ok} produtos enviados, ${erros} erros ━━━`, erros > 0 ? "err" : "info");
  btn.disabled = false;
});
</script>
</body>
</html>
